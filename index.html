ercase letters are each consecutive. EOF is -1 (not a char).\u003c/p>\n\u003ch3>Character arithmetic (rote these 8 lines)\u003c/h3>\n\u003cpre>int index   = c - 'a';              // 'a'->0, 'b'->1, ... 'z'->25\nchar letter = 'a' + index;          // 0->'a', 25->'z'\nint digit   = c - '0';              // '7' -> 7\nchar ch     = '0' + digit;          // 7 -> '7'\nchar upper  = c - 'a' + 'A';        // same as toupper(c) for lowercase c\nchar lower  = c - 'A' + 'a';        // same as tolower(c) for uppercase c\nint is_low  = c &gt;= 'a' &amp;&amp; c &lt;= 'z'; // same as islower(c)\nchar next   = 'a' + (c - 'a' + k) % 26;   // shift by k, wrapping z -&gt; a\u003c/pre>\n\u003cp class=\"ex\">\u003cb>Example.\u003c/b> \u003cspan class=\"mono\">printf(\"%c %d %c\\n\", 'a' + 2, 'b' - 'a', 'z' - 25);\u003c/span> prints \u003cspan class=\"mono\">c 1 a\u003c/span>.\u003c/p>"},{"num":4,"title":"Operators and expressions","html":"\u003col class=\"rules\">\n\u003cli>\u003cspan class=\"r\">R4.1\u003c/span> \u003cspan class=\"mono\">int / int\u003c/span> gives an \u003cspan class=\"mono\">int\u003c/span>. The fraction is thrown away (truncated toward zero): \u003cspan class=\"mono\">7 / 2 == 3\u003c/span>, \u003cspan class=\"mono\">-7 / 2 == -3\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R4.2\u003c/span> To get a decimal answer, make one side a double: \u003cspan class=\"mono\">7.0 / 2 == 3.5\u003c/span>, \u003cspan class=\"mono\">(double) sum / count\u003c/span>. Casting AFTER the division is too late: \u003cspan class=\"mono\">(double)(7 / 2) == 3.0\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R4.3\u003c/span> \u003cspan class=\"mono\">%\u003c/span> is the remainder, ints only. \u003cspan class=\"mono\">7 % 3 == 1\u003c/span>, \u003cspan class=\"mono\">-7 % 3 == -1\u003c/span> (sign follows the left side). Even test: \u003cspan class=\"mono\">n % 2 == 0\u003c/span>. Odd test: \u003cspan class=\"mono\">n % 2 != 0\u003c/span> (NOT \u003cspan class=\"mono\">== 1\u003c/span>, fails for negatives).\u003c/li>\n\u003cli>\u003cspan class=\"r\">R4.4\u003c/span> Last digit: \u003cspan class=\"mono\">n % 10\u003c/span>. Remove last digit: \u003cspan class=\"mono\">n / 10\u003c/span>. Divisible by k: \u003cspan class=\"mono\">n % k == 0\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R4.5\u003c/span> Division or \u003cspan class=\"mono\">%\u003c/span> by zero crashes. Check the divisor first.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R4.6\u003c/span> \u003cspan class=\"mono\">=\u003c/span> assigns, \u003cspan class=\"mono\">==\u003c/span> compares. \u003cspan class=\"mono\">if (x = 5)\u003c/span> sets x to 5 and is always true.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R4.7\u003c/span> \u003cspan class=\"mono\">x += 3\u003c/span> means \u003cspan class=\"mono\">x = x + 3\u003c/span> (also \u003cspan class=\"mono\">-=\u003c/span>, \u003cspan class=\"mono\">*=\u003c/span>, \u003cspan class=\"mono\">/=\u003c/span>, \u003cspan class=\"mono\">%=\u003c/span>). \u003cspan class=\"mono\">i++\u003c/span> means \u003cspan class=\"mono\">i = i + 1\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R4.8\u003c/span> In C, false is 0 and true is any non-zero value. Comparisons produce 1 or 0.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R4.9\u003c/span> Logical operators: \u003cspan class=\"mono\">&amp;&amp;\u003c/span> and, \u003cspan class=\"mono\">||\u003c/span> or, \u003cspan class=\"mono\">!\u003c/span> not. Do not confuse with bitwise \u003cspan class=\"mono\">&amp;\u003c/span> and \u003cspan class=\"mono\">|\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R4.10\u003c/span> SHORT-CIRCUIT: in \u003cspan class=\"mono\">A &amp;&amp; B\u003c/span>, if A is false, B is never evaluated. In \u003cspan class=\"mono\">A || B\u003c/span>, if A is true, B is never evaluated. So put the safety check FIRST: \u003cspan class=\"mono\">curr != NULL &amp;&amp; curr-&gt;data &gt; 0\u003c/span>, \u003cspan class=\"mono\">n != 0 &amp;&amp; m % n == 0\u003c/span>, \u003cspan class=\"mono\">i &lt; size &amp;&amp; a[i] != x\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R4.11\u003c/span> \u003cspan class=\"mono\">a &lt; b &lt; c\u003c/span> is WRONG in C (it compares (a&lt;b), which is 0 or 1, with c). Write \u003cspan class=\"mono\">a &lt; b &amp;&amp; b &lt; c\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R4.12\u003c/span> Testing a range: inside is \u003cspan class=\"mono\">x &gt;= lo &amp;&amp; x &lt;= hi\u003c/span>; outside is \u003cspan class=\"mono\">x &lt; lo || x &gt; hi\u003c/span>. (Outside with \u003cspan class=\"mono\">&amp;&amp;\u003c/span> is never true: a common debugging-question bug.)\u003c/li>\n\u003cli>\u003cspan class=\"r\">R4.13\u003c/span> De Morgan: \u003cspan class=\"mono\">!(A &amp;&amp; B) == !A || !B\u003c/span> and \u003cspan class=\"mono\">!(A || B) == !A &amp;&amp; !B\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R4.14\u003c/span> Precedence (high to low): \u003cspan class=\"mono\">()\u003c/span> then unary \u003cspan class=\"mono\">! - ++ * &amp;\u003c/span> then \u003cspan class=\"mono\">* / %\u003c/span> then \u003cspan class=\"mono\">+ -\u003c/span> then \u003cspan class=\"mono\">&lt; &lt;= &gt; &gt;=\u003c/span> then \u003cspan class=\"mono\">== !=\u003c/span> then \u003cspan class=\"mono\">&amp;&amp;\u003c/span> then \u003cspan class=\"mono\">||\u003c/span> then \u003cspan class=\"mono\">=\u003c/span>. When unsure, add brackets.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R4.15\u003c/span> \u003cspan class=\"mono\">-&gt;\u003c/span> and \u003cspan class=\"mono\">.\u003c/span> and \u003cspan class=\"mono\">[]\u003c/span> bind tighter than \u003cspan class=\"mono\">*\u003c/span>: \u003cspan class=\"mono\">*p.x\u003c/span> means \u003cspan class=\"mono\">*(p.x)\u003c/span>, so write \u003cspan class=\"mono\">(*p).x\u003c/span> or \u003cspan class=\"mono\">p-&gt;x\u003c/span>.\u003c/li>\n\u003c/ol>\n\u003ch3>Examples (cover the right column and predict)\u003c/h3>\n\u003ctable>\n\u003ctr>\u003cth>Expression\u003c/th>\u003cth>Value\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">1 - -2 * 3\u003c/td>\u003ctd>7\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">17 / 5 * 5 + 17 % 5\u003c/td>\u003ctd>17 (always true: (a/b)*b + a%b == a)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">9 / 2 * 2.0\u003c/td>\u003ctd>8.0 (9/2 is 4 first)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">2.0 * 9 / 2\u003c/td>\u003ctd>9.0\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">(5 &gt; 3) + (2 == 2)\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">!5\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">'a' &lt; 'b'\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">-9 % 4\u003c/td>\u003ctd>-1\u003c/td>\u003c/tr>\n\u003c/table>"},{"num":5,"title":"Input and output","html":"\u003ch2>5.1 printf\u003c/h2>\n\u003col class=\"rules\">\n\u003cli>\u003cspan class=\"r\">R5.1\u003c/span> \u003cspan class=\"mono\">printf\u003c/span> prints exactly what you write. No automatic newline: add \u003cspan class=\"mono\">\\n\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R5.2\u003c/span> One specifier per value, in order, matching type: \u003cspan class=\"mono\">printf(\"%d %c %.2lf %s\\n\", n, c, x, s);\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R5.3\u003c/span> Prompts like \u003cspan class=\"mono\">\"Enter mark: \"\u003c/span> usually have NO newline; the user's typing follows on the same line. Copy prompt strings from the spec exactly, including the trailing space.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R5.4\u003c/span> When input comes from a file (autotests), the user's typing is not shown, so the output looks like \u003cspan class=\"mono\">Enter mark: HD\u003c/span>. That is correct.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R5.5\u003c/span> \u003cspan class=\"mono\">putchar(c)\u003c/span> prints one character. \u003cspan class=\"mono\">printf(\"%s\", s)\u003c/span> prints a string.\u003c/li>\n\u003c/ol>\n\u003ch2>5.2 scanf\u003c/h2>\n\u003col class=\"rules\">\n\u003cli>\u003cspan class=\"r\">R5.6\u003c/span> scanf needs the ADDRESS of the variable: \u003cspan class=\"mono\">scanf(\"%d\", &amp;n)\u003c/span>. Exception: a char array (string) is already an address, so no \u003cspan class=\"mono\">&amp;\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R5.7\u003c/span> scanf RETURNS the number of values successfully read. It returns \u003cspan class=\"mono\">EOF\u003c/span> (-1) at end of input (CTRL+D), and 0 if the input does not match (for example letters when reading \u003cspan class=\"mono\">%d\u003c/span>).\u003c/li>\n\u003cli>\u003cspan class=\"r\">R5.8\u003c/span> Therefore the correct loop is \u003cspan class=\"mono\">while (scanf(\"%d\", &amp;x) == 1)\u003c/span>. The loop \u003cspan class=\"mono\">!= 0\u003c/span> runs forever at EOF because -1 is not 0. The loop \u003cspan class=\"mono\">!= EOF\u003c/span> runs forever on bad input.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R5.9\u003c/span> \u003cspan class=\"mono\">%d\u003c/span> and \u003cspan class=\"mono\">%lf\u003c/span> skip leading whitespace and newlines automatically. \u003cspan class=\"mono\">%c\u003c/span> does NOT: it reads the next character, often a leftover \u003cspan class=\"mono\">'\\n'\u003c/span>. Use \u003cspan class=\"mono\">\" %c\"\u003c/span> (space before %c) to skip whitespace.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R5.10\u003c/span> Several values: \u003cspan class=\"mono\">scanf(\"%d %d\", &amp;a, &amp;b)\u003c/span> returns 2 on success.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R5.11\u003c/span> Invalid input check: \u003cspan class=\"mono\">if (scanf(\"%d\", &amp;n) != 1) { printf(\"Invalid number\\n\"); return 0; }\u003c/span>.\u003c/li>\n\u003c/ol>\n\u003ch2>5.3 getchar\u003c/h2>\n\u003col class=\"rules\">\n\u003cli>\u003cspan class=\"r\">R5.12\u003c/span> \u003cspan class=\"mono\">getchar()\u003c/span> returns the next character as an \u003cspan class=\"mono\">int\u003c/span>, or \u003cspan class=\"mono\">EOF\u003c/span> at end of input. Store it in an \u003cspan class=\"mono\">int\u003c/span>, not a \u003cspan class=\"mono\">char\u003c/span>, so EOF can be detected.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R5.13\u003c/span> getchar reads EVERY character, including spaces and \u003cspan class=\"mono\">'\\n'\u003c/span>. Decide what the spec wants for the newline.\u003c/li>\n\u003c/ol>\n\u003ch2>5.4 fgets\u003c/h2>\n\u003col class=\"rules\">\n\u003cli>\u003cspan class=\"r\">R5.14\u003c/span> \u003cspan class=\"mono\">fgets(buf, size, stdin)\u003c/span> reads one line: at most \u003cspan class=\"mono\">size - 1\u003c/span> characters, KEEPS the \u003cspan class=\"mono\">'\\n'\u003c/span>, adds \u003cspan class=\"mono\">'\\0'\u003c/span>, returns \u003cspan class=\"mono\">NULL\u003c/span> at EOF.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R5.15\u003c/span> Remove the newline: \u003cspan class=\"mono\">buf[strcspn(buf, \"\\n\")] = '\\0';\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R5.16\u003c/span> Buffer size for lines of up to N characters: \u003cspan class=\"mono\">N + 2\u003c/span> (N chars, the newline, the '\\0').\u003c/li>\n\u003cli>\u003cspan class=\"r\">R5.17\u003c/span> Mixing \u003cspan class=\"mono\">scanf(\"%d\")\u003c/span> then \u003cspan class=\"mono\">fgets\u003c/span>: scanf leaves the \u003cspan class=\"mono\">'\\n'\u003c/span>, so fgets reads an empty line. Read the leftover first with \u003cspan class=\"mono\">getchar()\u003c/span>, or read numbers after the line.\u003c/li>\n\u003c/ol>\n\u003ch3>TEMPLATE 5.1: the four input loops\u003c/h3>\n\u003cpre>// (a) fixed count\nint n;\nscanf(\"%d\", &amp;n);\nfor (int i = 0; i &lt; n; i++) {\n    scanf(\"%d\", &amp;array[i]);\n}\n\n// (b) numbers until CTRL+D or bad input\nint x;\nwhile (scanf(\"%d\", &amp;x) == 1) {\n    // use x\n}\n\n// (c) characters until CTRL+D\nint c = getchar();\nwhile (c != EOF) {\n    // use c\n    c = getchar();\n}\n\n// (d) lines until CTRL+D\nchar line[MAX + 2];\nwhile (fgets(line, MAX + 2, stdin) != NULL) {\n    line[strcspn(line, \"\\n\")] = '\\0';\n    // use line\n}\u003c/pre>\n\u003cp class=\"ex\">\u003cb>Example.\u003c/b> Input \u003cspan class=\"mono\">10 20 x 30\u003c/span> with loop (b): reads 10 and 20, then scanf returns 0 at \u003cspan class=\"mono\">x\u003c/span>, loop ends. 30 is never read.\u003c/p>"},{"num":6,"title":"Control flow","html":"\u003col class=\"rules\">\n\u003cli>\u003cspan class=\"r\">R6.1\u003c/span> In an \u003cspan class=\"mono\">if / else if / else\u003c/span> chain, only the FIRST true branch runs. Put the most specific (narrowest) condition first.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R6.2\u003c/span> Thresholds in descending order with \u003cspan class=\"mono\">&gt;=\u003c/span>: check 85 before 75 before 65. Checking \u003cspan class=\"mono\">&gt;= 50\u003c/span> before \u003cspan class=\"mono\">&gt;= 65\u003c/span> makes CR unreachable.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R6.3\u003c/span> Always use braces, even for one line. \u003cspan class=\"mono\">else\u003c/span> belongs to the nearest unmatched \u003cspan class=\"mono\">if\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R6.4\u003c/span> \u003cspan class=\"mono\">while (cond) {...}\u003c/span> checks first, may run 0 times. A loop needs: initialise, test, update. Forgetting the update is an infinite loop.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R6.5\u003c/span> \u003cspan class=\"mono\">for (init; test; update)\u003c/span> is the same as a while loop. A variable declared in the for header exists only inside the loop.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R6.6\u003c/span> A loop over n items: \u003cspan class=\"mono\">for (int i = 0; i &lt; n; i++)\u003c/span> runs n times with i = 0 .. n-1. \u003cspan class=\"mono\">i &lt;= n\u003c/span> runs n+1 times (off by one).\u003c/li>\n\u003cli>\u003cspan class=\"r\">R6.7\u003c/span> \u003cspan class=\"mono\">break\u003c/span> leaves the innermost loop only. \u003cspan class=\"mono\">continue\u003c/span> jumps to the next iteration (in a for loop, the update still runs). \u003cspan class=\"mono\">return\u003c/span> leaves the whole function.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R6.8\u003c/span> To leave two nested loops at once, put them in a function and \u003cspan class=\"mono\">return\u003c/span>, or use a flag variable.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R6.9\u003c/span> Counting down: \u003cspan class=\"mono\">for (int i = n - 1; i &gt;= 0; i--)\u003c/span>.\u003c/li>\n\u003c/ol>\n\u003ch3>Example: the two loop patterns from lectures\u003c/h3>\n\u003cpre>// ACCUMULATE: answer built up over the whole loop\nint sum_digits(int n) {\n    int total = 0;              // 1. initialise before the loop\n    while (n &gt; 0) {\n        total += n % 10;        // 2. update inside the loop\n        n = n / 10;\n    }\n    return total;               // 3. return after the loop\n}\n\n// SEARCH: return as soon as found, \"not found\" after the loop\nint is_prime(int n) {\n    if (n &lt; 2) {\n        return 0;\n    }\n    for (int d = 2; d * d &lt;= n; d++) {\n        if (n % d == 0) {\n            return 0;           // found a divisor: stop\n        }\n    }\n    return 1;                   // loop finished: none found\n}\u003c/pre>\n\u003cp>\u003cb>Rote:\u003c/b> \"Accumulate: init, update, return after. Search: return inside, default after.\"\u003c/p>"},{"num":7,"title":"Functions","html":"\u003col class=\"rules\">\n\u003cli>\u003cspan class=\"r\">R7.1\u003c/span> Shape: \u003cspan class=\"mono\">return_type name(type param1, type param2) { ... }\u003c/span>. A function that returns nothing has type \u003cspan class=\"mono\">void\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R7.2\u003c/span> A function used before its definition needs a PROTOTYPE above main: \u003cspan class=\"mono\">int max(int a, int b);\u003c/span> (ends with a semicolon).\u003c/li>\n\u003cli>\u003cspan class=\"r\">R7.3\u003c/span> C passes arguments BY VALUE: the function gets a copy. Changing a parameter does not change the caller's variable.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R7.4\u003c/span> To change the caller's variable, pass its address and write through the pointer (Chapter 11).\u003c/li>\n\u003cli>\u003cspan class=\"r\">R7.5\u003c/span> Arrays passed to a function are NOT copied: the function receives the address of element 0, so changes to the array ARE seen by the caller. Always pass the size too.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R7.6\u003c/span> Structs ARE copied (every field). Pass a pointer to change a struct.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R7.7\u003c/span> Every path through a non-void function must \u003cspan class=\"mono\">return\u003c/span> a value. dcc warns \"control reaches end of non-void function\".\u003c/li>\n\u003cli>\u003cspan class=\"r\">R7.8\u003c/span> Never change the name, return type or parameters of a function the exam gives you. Add your own helper functions freely.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R7.9\u003c/span> \"Return\" means return; \"print\" means print. A function that should return must not print anything.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R7.10\u003c/span> A function returning 1 or 0 for yes/no is a predicate: name it \u003cspan class=\"mono\">is_...\u003c/span> or \u003cspan class=\"mono\">has_...\u003c/span>.\u003c/li>\n\u003c/ol>\n\u003ch3>Example: pass by value\u003c/h3>\n\u003cpre>void add_one(int x) {\n    x = x + 1;          // changes the copy only\n}\n\nint main(void) {\n    int n = 5;\n    add_one(n);\n    printf(\"%d\\n\", n);  // prints 5, not 6\n    return 0;\n}\u003c/pre>"},{"num":8,"title":"1D arrays","html":"\u003col class=\"rules\">\n\u003cli>\u003cspan class=\"r\">R8.1\u003c/span> \u003cspan class=\"mono\">int a[5];\u003c/span> makes 5 ints: \u003cspan class=\"mono\">a[0]\u003c/span> to \u003cspan class=\"mono\">a[4]\u003c/span>. Index \u003cspan class=\"mono\">a[5]\u003c/span> is OUT OF BOUNDS.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R8.2\u003c/span> Valid indexes for size n: 0 to n-1. The last element is \u003cspan class=\"mono\">a[n - 1]\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R8.3\u003c/span> Initialise: \u003cspan class=\"mono\">int a[5] = {1, 2, 3, 4, 5};\u003c/span>. \u003cspan class=\"mono\">int a[5] = {0};\u003c/span> sets ALL to 0. \u003cspan class=\"mono\">int a[] = {1, 2, 3};\u003c/span> has size 3. An array declared without initialiser holds garbage.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R8.4\u003c/span> You cannot assign a whole array: \u003cspan class=\"mono\">a = b;\u003c/span> is an error. Copy element by element.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R8.5\u003c/span> You cannot compare arrays with \u003cspan class=\"mono\">==\u003c/span> (it compares addresses).\u003c/li>\n\u003cli>\u003cspan class=\"r\">R8.6\u003c/span> Array size must be known: use \u003cspan class=\"mono\">#define MAX 100\u003c/span> and keep a separate count of used elements. Do not use variable-length arrays.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R8.7\u003c/span> Parameter forms \u003cspan class=\"mono\">int array[]\u003c/span> and \u003cspan class=\"mono\">int *array\u003c/span> mean the same thing.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R8.8\u003c/span> \u003cspan class=\"mono\">sizeof\u003c/span> inside a function gives the pointer size (8), not the array size. That is why size is passed.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R8.9\u003c/span> Max/min: start from \u003cspan class=\"mono\">array[0]\u003c/span>, NOT from 0 (all values might be negative).\u003c/li>\n\u003cli>\u003cspan class=\"r\">R8.10\u003c/span> Comparing neighbours \u003cspan class=\"mono\">array[i]\u003c/span> and \u003cspan class=\"mono\">array[i + 1]\u003c/span>: loop \u003cspan class=\"mono\">i &lt; size - 1\u003c/span>. Comparing with \u003cspan class=\"mono\">array[i - 1]\u003c/span>: start at \u003cspan class=\"mono\">i = 1\u003c/span>.\u003c/li>\n\u003c/ol>\n\u003ch3>TEMPLATE 8.1: the 12 array loops (write each from memory)\u003c/h3>\n\u003cpre>// 1. Sum\nint total = 0;\nfor (int i = 0; i &lt; size; i++) {\n    total += array[i];\n}\n\n// 2. Count matching\nint count = 0;\nfor (int i = 0; i &lt; size; i++) {\n    if (array[i] % 2 == 0) {\n        count++;\n    }\n}\n\n// 3. Maximum value (and its index)\nint max = array[0];\nint max_index = 0;\nfor (int i = 1; i &lt; size; i++) {\n    if (array[i] &gt; max) {          // &gt; keeps FIRST max; &gt;= keeps LAST\n        max = array[i];\n        max_index = i;\n    }\n}\n\n// 4. Search: index of first match, or -1\nfor (int i = 0; i &lt; size; i++) {\n    if (array[i] == target) {\n        return i;\n    }\n}\nreturn -1;\n\n// 5. All elements satisfy? (return early on a counter-example)\nfor (int i = 0; i &lt; size; i++) {\n    if (array[i] &lt; 0) {\n        return 0;\n    }\n}\nreturn 1;\n\n// 6. Neighbours\nfor (int i = 0; i &lt; size - 1; i++) {\n    if (array[i] == array[i + 1]) { /* adjacent equal pair */ }\n}\n\n// 7. Reverse in place\nfor (int i = 0; i &lt; size / 2; i++) {\n    int tmp = array[i];\n    array[i] = array[size - 1 - i];\n    array[size - 1 - i] = tmp;\n}\n\n// 8. Swap two elements\nint tmp = array[i];\narray[i] = array[j];\narray[j] = tmp;\n\n// 9. Remove element at index k (shift left)\nfor (int i = k; i &lt; size - 1; i++) {\n    array[i] = array[i + 1];\n}\nsize--;\n\n// 10. Insert value at index k (shift right; array must have room)\nfor (int i = size; i &gt; k; i--) {\n    array[i] = array[i - 1];\n}\narray[k] = value;\nsize++;\n\n// 11. Frequency table (values 0..99, or letters with c - 'a')\nint freq[100] = {0};\nfor (int i = 0; i &lt; size; i++) {\n    freq[array[i]]++;\n}\n\n// 12. Longest run of equal neighbours\nint best = 1;\nint run = 1;\nfor (int i = 1; i &lt; size; i++) {\n    if (array[i] == array[i - 1]) {\n        run++;\n    } else {\n        run = 1;\n    }\n    if (run &gt; best) {\n        best = run;\n    }\n}\u003c/pre>\n\u003ch3>Example: trace of reverse\u003c/h3>\n\u003cp>array = {1, 2, 3, 4, 5}, size 5, so size/2 = 2 swaps: i=0 swaps 1 and 5, i=1 swaps 2 and 4. Result {5, 4, 3, 2, 1}. The middle element 3 stays.\u003c/p>"},{"num":9,"title":"2D arrays (array hurdle)","html":"\u003col class=\"rules\">\n\u003cli>\u003cspan class=\"r\">R9.1\u003c/span> \u003cspan class=\"mono\">int grid[ROWS][COLS];\u003c/span> access \u003cspan class=\"mono\">grid[row][col]\u003c/span>. FIRST index = row (which line, top to bottom). SECOND index = column (position along the line, left to right).\u003c/li>\n\u003cli>\u003cspan class=\"r\">R9.2\u003c/span> Visit every cell: outer loop rows, inner loop columns.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R9.3\u003c/span> Parameter must state the column count: \u003cspan class=\"mono\">int f(int size, int array[100][100])\u003c/span> or \u003cspan class=\"mono\">int f(int array[SIZE][SIZE])\u003c/span>. Copy the exam's prototype exactly.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R9.4\u003c/span> If the array is declared [100][100] but size is smaller, only use indexes below size.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R9.5\u003c/span> Initialise: \u003cspan class=\"mono\">int g[2][3] = {{1, 2, 3}, {4, 5, 6}};\u003c/span>. \u003cspan class=\"mono\">int g[5][5] = {{0}};\u003c/span> is all zeros.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R9.6\u003c/span> In an n x n array: corners are (0,0), (0,n-1), (n-1,0), (n-1,n-1). Centre (n odd) is (n/2, n/2).\u003c/li>\n\u003cli>\u003cspan class=\"r\">R9.7\u003c/span> Main diagonal: \u003cspan class=\"mono\">row == col\u003c/span>. Anti-diagonal: \u003cspan class=\"mono\">row + col == n - 1\u003c/span>. Above main diagonal: \u003cspan class=\"mono\">col &gt; row\u003c/span>. Below: \u003cspan class=\"mono\">col &lt; row\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R9.8\u003c/span> Border cell: \u003cspan class=\"mono\">row == 0 || row == n - 1 || col == 0 || col == n - 1\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R9.9\u003c/span> Neighbour (nr, nc) exists only if \u003cspan class=\"mono\">nr &gt;= 0 &amp;&amp; nr &lt; n &amp;&amp; nc &gt;= 0 &amp;&amp; nc &lt; n\u003c/span>. Test this BEFORE reading \u003cspan class=\"mono\">grid[nr][nc]\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R9.10\u003c/span> Counting each cell once: visit every cell exactly once and test a condition. Then no cell (no corner) can be double counted.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R9.11\u003c/span> For \"X in its row AND Y in its column\" problems, write one helper per condition.\u003c/li>\n\u003c/ol>\n\u003ch3>Position cheat sheet (n x n)\u003c/h3>\n\u003ctable>\n\u003ctr>\u003cth>Want\u003c/th>\u003cth>Loop\u003c/th>\u003cth>Cell\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Row r\u003c/td>\u003ctd class=\"mono\">for col 0..n-1\u003c/td>\u003ctd class=\"mono\">grid[r][col]\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Column c\u003c/td>\u003ctd class=\"mono\">for row 0..n-1\u003c/td>\u003ctd class=\"mono\">grid[row][c]\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Main diagonal\u003c/td>\u003ctd class=\"mono\">for i 0..n-1\u003c/td>\u003ctd class=\"mono\">grid[i][i]\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Anti-diagonal\u003c/td>\u003ctd class=\"mono\">for i 0..n-1\u003c/td>\u003ctd class=\"mono\">grid[i][n-1-i]\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Transpose (swap)\u003c/td>\u003ctd>only cells with col &gt; row\u003c/td>\u003ctd class=\"mono\">grid[row][col] &lt;-&gt; grid[col][row]\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4 neighbours\u003c/td>\u003ctd class=\"mono\">dr = {-1,1,0,0}, dc = {0,0,-1,1}\u003c/td>\u003ctd class=\"mono\">grid[r+dr[k]][c+dc[k]]\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>8 neighbours\u003c/td>\u003ctd class=\"mono\">dr, dc in -1..1, skip (0,0)\u003c/td>\u003ctd class=\"mono\">grid[r+dr][c+dc]\u003c/td>\u003c/tr>\n\u003c/table>\n\u003ch3>TEMPLATE 9.1: visit every cell with a condition (border sum, corners once)\u003c/h3>\n\u003cpre>int sum_border(int size, int array[100][100]) {\n    int total = 0;\n    for (int row = 0; row &lt; size; row++) {\n        for (int col = 0; col &lt; size; col++) {\n            if (row == 0 || row == size - 1 || col == 0 || col == size - 1) {\n                total += array[row][col];\n            }\n        }\n    }\n    return total;\n}\u003c/pre>\n\u003cp class=\"ex\">\u003cb>Example.\u003c/b> 3x3 grid 1..9 (rows 1 2 3 / 4 5 6 / 7 8 9): border sum = 45 - 5 = 40. 2x2 grid 1 2 / 4 5: every cell is border, sum = 12.\u003c/p>\n\u003ch3>TEMPLATE 9.2: row condition AND column condition (saddle point)\u003c/h3>\n\u003cpre>#define SIZE 5\n\nint is_row_min(int array[SIZE][SIZE], int row, int col) {\n    for (int c = 0; c &lt; SIZE; c++) {\n        if (array[row][c] &lt; array[row][col]) {\n            return 0;\n        }\n    }\n    return 1;\n}\n\nint is_col_max(int array[SIZE][SIZE], int row, int col) {\n    for (int r = 0; r &lt; SIZE; r++) {\n        if (array[r][col] &gt; array[row][col]) {\n            return 0;\n        }\n    }\n    return 1;\n}\n\nint find_saddle_point(int array[SIZE][SIZE]) {\n    for (int row = 0; row &lt; SIZE; row++) {\n        for (int col = 0; col &lt; SIZE; col++) {\n            if (is_row_min(array, row, col) &amp;&amp; is_col_max(array, row, col)) {\n                return array[row][col];\n            }\n        }\n    }\n    return -1;\n}\u003c/pre>\n\u003cp>\u003cb>Rote:\u003c/b> the helper loops over the OTHER index. Row helper loops over columns c; column helper loops over rows r.\u003c/p>\n\u003ch3>TEMPLATE 9.3: diagonals with the centre once\u003c/h3>\n\u003cpre>int total = 0;\nfor (int i = 0; i &lt; size; i++) {\n    total += array[i][i];\n    if (size - 1 - i != i) {            // skip the centre the second time\n        total += array[i][size - 1 - i];\n    }\n}\u003c/pre>\n\u003ch3>TEMPLATE 9.4: neighbours in bounds\u003c/h3>\n\u003cpre>int dr[4] = {-1, 1, 0, 0};\nint dc[4] = {0, 0, -1, 1};\nfor (int k = 0; k &lt; 4; k++) {\n    int nr = r + dr[k];\n    int nc = c + dc[k];\n    if (nr &gt;= 0 &amp;&amp; nr &lt; SIZE &amp;&amp; nc &gt;= 0 &amp;&amp; nc &lt; SIZE) {\n        // grid[nr][nc] is a real neighbour\n    }\n}\u003c/pre>\n\u003ch3>TEMPLATE 9.5: row sums and column sums\u003c/h3>\n\u003cpre>for (int row = 0; row &lt; n; row++) {\n    int row_sum = 0;\n    for (int col = 0; col &lt; n; col++) {\n        row_sum += grid[row][col];\n    }\n}\nfor (int col = 0; col &lt; n; col++) {\n    int col_sum = 0;\n    for (int row = 0; row &lt; n; row++) {\n        col_sum += grid[row][col];   // note: still grid[row][col]\n    }\n}\u003c/pre>"},{"num":10,"title":"Strings","html":"\u003col class=\"rules\">\n\u003cli>\u003cspan class=\"r\">R10.1\u003c/span> A string is a \u003cspan class=\"mono\">char\u003c/span> array ending with \u003cspan class=\"mono\">'\\0'\u003c/span> (value 0). Everything that reads a string stops at \u003cspan class=\"mono\">'\\0'\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R10.2\u003c/span> \u003cspan class=\"mono\">'\\0'\u003c/span> is NOT \u003cspan class=\"mono\">'0'\u003c/span>. \u003cspan class=\"mono\">'\\0' == 0\u003c/span>, \u003cspan class=\"mono\">'0' == 48\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R10.3\u003c/span> Array size = longest length + 1 for the \u003cspan class=\"mono\">'\\0'\u003c/span>. For fgets add one more for the \u003cspan class=\"mono\">'\\n'\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R10.4\u003c/span> \u003cspan class=\"mono\">char s[] = \"hi\";\u003c/span> is an array of 3 (h, i, \\0) you can modify. \u003cspan class=\"mono\">char *s = \"hi\";\u003c/span> points to a read-only literal: do not modify it.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R10.5\u003c/span> \u003cspan class=\"mono\">strlen(s)\u003c/span> counts characters BEFORE the \u003cspan class=\"mono\">'\\0'\u003c/span>. \u003cspan class=\"mono\">strlen(\"hi\") == 2\u003c/span>. \u003cspan class=\"mono\">sizeof\u003c/span> of the array \u003cspan class=\"mono\">char s[] = \"hi\"\u003c/span> is 3.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R10.6\u003c/span> Compare with \u003cspan class=\"mono\">strcmp(a, b) == 0\u003c/span>, NEVER \u003cspan class=\"mono\">a == b\u003c/span>. strcmp is negative if a sorts first, positive if after.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R10.7\u003c/span> Copy with \u003cspan class=\"mono\">strcpy(dst, src)\u003c/span>, NEVER \u003cspan class=\"mono\">dst = src\u003c/span>. dst must have room for strlen(src) + 1.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R10.8\u003c/span> A string you build character by character MUST end with \u003cspan class=\"mono\">result[pos] = '\\0';\u003c/span>. Without it printf prints garbage.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R10.9\u003c/span> Walk a string with \u003cspan class=\"mono\">for (int i = 0; s[i] != '\\0'; i++)\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R10.10\u003c/span> The empty string has \u003cspan class=\"mono\">s[0] == '\\0'\u003c/span> and length 0. Test your code on it.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R10.11\u003c/span> A string is passed to a function as \u003cspan class=\"mono\">char *s\u003c/span> or \u003cspan class=\"mono\">char s[]\u003c/span>. No size is needed because the \u003cspan class=\"mono\">'\\0'\u003c/span> marks the end.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R10.12\u003c/span> A function cannot return a local array (it disappears when the function returns). Return a malloc'd string instead and free it later.\u003c/li>\n\u003c/ol>\n\u003ch3>String functions (string.h and ctype.h)\u003c/h3>\n\u003ctable>\n\u003ctr>\u003cth>Call\u003c/th>\u003cth>Does\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">strlen(s)\u003c/td>\u003ctd>length without '\\0'\u003c/td>\u003ctd class=\"mono\">strlen(\"cat\") == 3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">strcpy(d, s)\u003c/td>\u003ctd>copy s into d\u003c/td>\u003ctd class=\"mono\">strcpy(name, \"Dax\")\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">strcmp(a, b)\u003c/td>\u003ctd>0 if equal\u003c/td>\u003ctd class=\"mono\">strcmp(\"ab\",\"ab\") == 0\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">strcat(d, s)\u003c/td>\u003ctd>append s to end of d\u003c/td>\u003ctd class=\"mono\">\"ab\" + \"cd\" gives \"abcd\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">strcspn(s, \"\\n\")\u003c/td>\u003ctd>index of first '\\n' (or length)\u003c/td>\u003ctd class=\"mono\">strcspn(\"hi\\n\",\"\\n\") == 2\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">strchr(s, c)\u003c/td>\u003ctd>pointer to first c, or NULL\u003c/td>\u003ctd class=\"mono\">strchr(\"abc\",'b') != NULL\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">isalpha(c)\u003c/td>\u003ctd>letter?\u003c/td>\u003ctd class=\"mono\">isalpha('x') true\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">isdigit(c)\u003c/td>\u003ctd>'0'..'9'?\u003c/td>\u003ctd class=\"mono\">isdigit('7') true\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">isspace(c)\u003c/td>\u003ctd>space, \\t, \\n?\u003c/td>\u003ctd class=\"mono\">isspace(' ') true\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">isupper / islower\u003c/td>\u003ctd>case test\u003c/td>\u003ctd class=\"mono\">isupper('Q') true\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"mono\">toupper / tolower\u003c/td>\u003ctd>convert case (others unchanged)\u003c/td>\u003ctd class=\"mono\">toupper('a') == 'A'\u003c/td>\u003c/tr>\n\u003c/table>\n\u003ch3>TEMPLATE 10.1: read a line safely\u003c/h3>\n\u003cpre>#define MAX_LEN 100\nchar text[MAX_LEN + 2];\nprintf(\"Text: \");\nif (fgets(text, MAX_LEN + 2, stdin) == NULL) {\n    return 0;                       // CTRL+D, no input\n}\ntext[strcspn(text, \"\\n\")] = '\\0';  // remove the newline\u003c/pre>\n\u003ch3>TEMPLATE 10.2: is_vowel, count, filter\u003c/h3>\n\u003cpre>int is_vowel(char c) {\n    c = tolower(c);\n    return c == 'a' || c == 'e' || c == 'i' || c == 'o' || c == 'u';\n}\n\nint count_vowels(char *s) {\n    int count = 0;\n    for (int i = 0; s[i] != '\\0'; i++) {\n        if (is_vowel(s[i])) {\n            count++;\n        }\n    }\n    return count;\n}\n\n// remove vowels IN PLACE: read index i, write index j\nvoid remove_vowels(char *s) {\n    int j = 0;\n    for (int i = 0; s[i] != '\\0'; i++) {\n        if (!is_vowel(s[i])) {\n            s[j] = s[i];\n            j++;\n        }\n    }\n    s[j] = '\\0';\n}\u003c/pre>\n\u003ch3>TEMPLATE 10.3: reverse a string and palindrome check\u003c/h3>\n\u003cpre>void reverse_string(char *s) {\n    int len = strlen(s);\n    for (int i = 0; i &lt; len / 2; i++) {\n        char tmp = s[i];\n        s[i] = s[len - 1 - i];\n        s[len - 1 - i] = tmp;\n    }\n}\n\nint is_palindrome(char *s) {\n    int len = strlen(s);\n    for (int i = 0; i &lt; len / 2; i++) {\n        if (s[i] != s[len - 1 - i]) {\n            return 0;\n        }\n    }\n    return 1;\n}\u003c/pre>\n\u003ch3>TEMPLATE 10.4: letter frequency\u003c/h3>\n\u003cpre>int freq[26] = {0};\nfor (int i = 0; s[i] != '\\0'; i++) {\n    if (islower(s[i])) {\n        freq[s[i] - 'a']++;\n    }\n}\nfor (int k = 0; k &lt; 26; k++) {\n    if (freq[k] &gt; 0) {\n        printf(\"%c: %d\\n\", 'a' + k, freq[k]);\n    }\n}\u003c/pre>\n\u003ch3>TEMPLATE 10.5: build a string of unknown length (Q9 pattern)\u003c/h3>\n\u003cp>Two passes. Pass 1 measures the length. malloc length + 1. Pass 2 fills. End with \u003cspan class=\"mono\">'\\0'\u003c/span>. Free after printing.\u003c/p>\n\u003cpre>// Each letter c becomes nums[c - 'a'] letters, starting WITH c, wrapping z-&gt;a.\nint total = 0;\nfor (int i = 0; original[i] != '\\0'; i++) {          // pass 1\n    total += nums[original[i] - 'a'];\n}\nchar *result = malloc(total + 1);                    // +1 for '\\0'\nint pos = 0;\nfor (int i = 0; original[i] != '\\0'; i++) {          // pass 2\n    int start = original[i] - 'a';\n    for (int k = 0; k &lt; nums[start]; k++) {          // k = 0 includes c itself\n        result[pos] = 'a' + (start + k) % 26;\n        pos++;\n    }\n}\nresult[pos] = '\\0';\nprintf(\"Result string: %s\\n\", result);\nfree(result);\u003c/pre>\n\u003cp class=\"ex\">\u003cb>Example.\u003c/b> original \"az\", nums['a'] = 3, nums['z'] = 2, others 0. 'a' gives a, b, c. 'z' gives z, a. Result \"abcza\". If the spec says \"the NEXT letters\" instead, loop \u003cspan class=\"mono\">k = 1 .. nums[start]\u003c/span> and the result becomes \"bcdab\".\u003c/p>\n\u003ch3>TEMPLATE 10.6: run-length counting\u003c/h3>\n\u003cpre>int i = 0;\nwhile (s[i] != '\\0') {\n    int run = 1;\n    while (s[i + run] == s[i]) {   // stops at '\\0' because s[i] != '\\0'\n        run++;\n    }\n    printf(\"%c%d\", s[i], run);\n    i += run;\n}\nprintf(\"\\n\");\u003c/pre>\n\u003cp class=\"ex\">\u003cb>Example.\u003c/b> \"aaabccdddd\" prints \u003cspan class=\"mono\">a3b1c2d4\u003c/span>.\u003c/p>"},{"num":11,"title":"Pointers","html":"\u003col class=\"rules\">\n\u003cli>\u003cspan class=\"r\">R11.1\u003c/span> A pointer stores an address. \u003cspan class=\"mono\">int *p\u003c/span> means \"p points to an int\".\u003c/li>\n\u003cli>\u003cspan class=\"r\">R11.2\u003c/span> \u003cspan class=\"mono\">&amp;x\u003c/span> = address of x. \u003cspan class=\"mono\">*p\u003c/span> = the thing p points to (dereference). They undo each other: \u003cspan class=\"mono\">*&amp;x == x\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R11.3\u003c/span> \u003cspan class=\"mono\">*p = 10;\u003c/span> writes into the variable p points to. \u003cspan class=\"mono\">p = &amp;y;\u003c/span> makes p point somewhere else.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R11.4\u003c/span> \u003cspan class=\"mono\">NULL\u003c/span> means \"points to nothing\". Dereferencing NULL (or an uninitialised pointer) crashes.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R11.5\u003c/span> The star in a declaration belongs to each name: \u003cspan class=\"mono\">int *a, b;\u003c/span> makes a a pointer but b a plain int.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R11.6\u003c/span> An array name is the address of element 0: \u003cspan class=\"mono\">a == &amp;a[0]\u003c/span>, and \u003cspan class=\"mono\">a[i] == *(a + i)\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R11.7\u003c/span> Output parameters: to \"return\" several values, take pointers and write through them. Inside: \u003cspan class=\"mono\">*out = value;\u003c/span>. Caller: \u003cspan class=\"mono\">f(&amp;var);\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R11.8\u003c/span> Never return the address of a local variable.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R11.9\u003c/span> \u003cspan class=\"mono\">p-&gt;field\u003c/span> is short for \u003cspan class=\"mono\">(*p).field\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R11.10\u003c/span> The two output-parameter bugs (Q7): writing \u003cspan class=\"mono\">area = ...\u003c/span> instead of \u003cspan class=\"mono\">*area = ...\u003c/span> inside the function, and calling \u003cspan class=\"mono\">f(area)\u003c/span> instead of \u003cspan class=\"mono\">f(&amp;area)\u003c/span>.\u003c/li>\n\u003c/ol>\n\u003ch3>TEMPLATE 11.1: swap\u003c/h3>\n\u003cpre>void swap(int *a, int *b) {\n    int tmp = *a;\n    *a = *b;\n    *b = tmp;\n}\n// call: swap(&amp;x, &amp;y);\u003c/pre>\n\u003ch3>TEMPLATE 11.2: several results through pointers\u003c/h3>\n\u003cpre>void calculate_rectangle(int length, int width, int *perimeter, int *area) {\n    *perimeter = 2 * (length + width);\n    *area = length * width;\n}\n\nint main(void) {\n    int perimeter, area;\n    calculate_rectangle(3, 4, &amp;perimeter, &amp;area);\n    printf(\"%d %d\\n\", perimeter, area);     // 14 12\n    return 0;\n}\u003c/pre>\n\u003ch3>Example: trace\u003c/h3>\n\u003cpre>int x = 5;\nint y = 7;\nint *p = &amp;x;\n*p = *p + y;      // x = 12\np = &amp;y;\n*p = 0;           // y = 0\nprintf(\"%d %d\\n\", x, y);    // 12 0\u003c/pre>"},{"num":12,"title":"Structs and typedef","html":"\u003col class=\"rules\">\n\u003cli>\u003cspan class=\"r\">R12.1\u003c/span> A struct groups named fields of different types. The definition ends with \u003cspan class=\"mono\">};\u003c/span> (semicolon).\u003c/li>\n\u003cli>\u003cspan class=\"r\">R12.2\u003c/span> Access a field with \u003cspan class=\"mono\">.\u003c/span> on a struct variable and \u003cspan class=\"mono\">-&gt;\u003c/span> on a pointer to a struct.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R12.3\u003c/span> \u003cspan class=\"mono\">typedef struct node { ... } node;\u003c/span> lets you write \u003cspan class=\"mono\">node\u003c/span> instead of \u003cspan class=\"mono\">struct node\u003c/span>. Inside the braces you must still write \u003cspan class=\"mono\">struct node *next\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R12.4\u003c/span> Designated initialiser: \u003cspan class=\"mono\">struct point p = {.x = 1, .y = 2};\u003c/span>. Missing fields become 0.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R12.5\u003c/span> Assigning one struct to another copies all fields (unlike arrays). A char array field must be set with strcpy.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R12.6\u003c/span> An array of structs: \u003cspan class=\"mono\">students[i].mark\u003c/span>.\u003c/li>\n\u003c/ol>\n\u003cpre>struct student {\n    int zid;\n    double mark;\n    char name[50];\n};\n\nstruct student s = {.zid = 5555555, .mark = 87.5};\nstrcpy(s.name, \"Dax\");\nstruct student *sp = &amp;s;\nsp-&gt;mark = 90.0;                 // same as (*sp).mark = 90.0\nprintf(\"%s %.1lf\\n\", s.name, s.mark);   // Dax 90.0\u003c/pre>"},{"num":13,"title":"Memory: malloc, free, realloc","html":"\u003col class=\"rules\">\n\u003cli>\u003cspan class=\"r\">R13.1\u003c/span> Local variables live on the STACK and disappear when their function returns. malloc'd memory lives on the HEAP until you free it.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R13.2\u003c/span> Use malloc when memory must outlive a function (every linked list node) or when the size is only known while running.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R13.3\u003c/span> \u003cspan class=\"mono\">malloc(bytes)\u003c/span> returns the address of new memory, or NULL if it fails. Contents are garbage until you set them.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R13.4\u003c/span> Size formulas: one node \u003cspan class=\"mono\">malloc(sizeof(node))\u003c/span>; n ints \u003cspan class=\"mono\">malloc(n * sizeof(int))\u003c/span>; string of length L \u003cspan class=\"mono\">malloc(L + 1)\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R13.5\u003c/span> \u003cspan class=\"mono\">malloc(sizeof(node *))\u003c/span> is a BUG: it allocates only 8 bytes (the size of a pointer).\u003c/li>\n\u003cli>\u003cspan class=\"r\">R13.6\u003c/span> Every malloc has exactly ONE matching free. Missing free = memory leak (fails --leak-check tests).\u003c/li>\n\u003cli>\u003cspan class=\"r\">R13.7\u003c/span> After \u003cspan class=\"mono\">free(p)\u003c/span>, never read \u003cspan class=\"mono\">p-&gt;anything\u003c/span> (use after free). Save what you need first.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R13.8\u003c/span> Never free twice. Never free a stack variable or an array you did not malloc.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R13.9\u003c/span> realloc: store into a temp first, then assign if not NULL. \u003cspan class=\"mono\">a = realloc(a, ...)\u003c/span> leaks if realloc fails.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R13.10\u003c/span> Whoever mallocs does not have to free in the same function; but SOMEONE must free before the program ends.\u003c/li>\n\u003c/ol>\n\u003cpre>int *nums = malloc(n * sizeof(int));\nif (nums == NULL) {\n    return 1;\n}\nfor (int i = 0; i &lt; n; i++) {\n    nums[i] = i * i;\n}\nfree(nums);\n\nint *temp = realloc(nums2, new_size * sizeof(int));\nif (temp != NULL) {\n    nums2 = temp;\n}\u003c/pre>"},{"num":14,"title":"Linked lists (linked list hurdle)","html":"\u003cp>Linked lists carry up to half the exam marks (Q1, Q3, Q8, Q10, Q11). Every question is one of two lecture patterns: PROCESS EVERY NODE or LOOK AHEAD WITH prev.\u003c/p>\n\u003ch2>14.1 The node and the picture\u003c/h2>\n\u003cpre>typedef struct node {\n    int data;\n    struct node *next;\n} node;\n\nhead\n |\n v\n[ 1 | *-]--&gt; [ 5 | *-]--&gt; [ 3 | *-]--&gt; NULL (X)\u003c/pre>\n\u003col class=\"rules\">\n\u003cli>\u003cspan class=\"r\">R14.1\u003c/span> A list is a pointer to its first node (head). The empty list is \u003cspan class=\"mono\">head == NULL\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.2\u003c/span> The last node has \u003cspan class=\"mono\">next == NULL\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.3\u003c/span> Never move \u003cspan class=\"mono\">head\u003c/span> while traversing. Use a separate \u003cspan class=\"mono\">curr\u003c/span> (or \u003cspan class=\"mono\">prev\u003c/span>).\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.4\u003c/span> Before writing \u003cspan class=\"mono\">X-&gt;\u003c/span>, you must KNOW that X is not NULL. Every loop condition protects the next line.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.5\u003c/span> \u003cspan class=\"mono\">while (curr != NULL)\u003c/span>: visits every node; afterwards curr is NULL.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.6\u003c/span> \u003cspan class=\"mono\">while (curr-&gt;next != NULL)\u003c/span>: stops ON the last node; only valid if curr starts non-NULL.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.7\u003c/span> To use \u003cspan class=\"mono\">curr\u003c/span> and \u003cspan class=\"mono\">curr-&gt;next\u003c/span> together: \u003cspan class=\"mono\">while (curr != NULL &amp;&amp; curr-&gt;next != NULL)\u003c/span> (order matters: short-circuit).\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.8\u003c/span> To change the link INTO a node, stand on the node BEFORE it (\u003cspan class=\"mono\">prev\u003c/span>). A singly linked list cannot go backwards.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.9\u003c/span> Deleting or inserting at the HEAD is always a special case, because there is no prev. Handle it first.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.10\u003c/span> Any function that might change the first node returns the new head, and the caller writes \u003cspan class=\"mono\">head = f(head, ...);\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.11\u003c/span> Delete in three steps: (1) \u003cspan class=\"mono\">to_delete = prev-&gt;next;\u003c/span> (2) \u003cspan class=\"mono\">prev-&gt;next = to_delete-&gt;next;\u003c/span> (3) \u003cspan class=\"mono\">free(to_delete);\u003c/span>. Never free before relinking.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.12\u003c/span> Insert after prev in two steps: (1) \u003cspan class=\"mono\">new-&gt;next = prev-&gt;next;\u003c/span> (2) \u003cspan class=\"mono\">prev-&gt;next = new;\u003c/span>. Reversing the order loses the rest of the list.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.13\u003c/span> When deleting many nodes, do NOT advance prev after a deletion (the new \u003cspan class=\"mono\">prev-&gt;next\u003c/span> has not been checked yet).\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.14\u003c/span> Freeing a list: save \u003cspan class=\"mono\">next\u003c/span> BEFORE \u003cspan class=\"mono\">free(curr)\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.15\u003c/span> Exam restriction words: \"do not use arrays\" (no copying into an array), \"do not call malloc\" (delete questions), \"do not modify the list\" (counting questions).\u003c/li>\n\u003c/ol>\n\u003ch2>14.2 Pattern 1: process every node\u003c/h2>\n\u003ch3>TEMPLATE 14.1: length, sum, count, contains, max\u003c/h3>\n\u003cpre>int length(node *head) {\n    int count = 0;\n    node *curr = head;\n    while (curr != NULL) {\n        count++;\n        curr = curr-&gt;next;\n    }\n    return count;\n}\n\nint sum_list(node *head) {\n    int total = 0;\n    for (node *curr = head; curr != NULL; curr = curr-&gt;next) {\n        total += curr-&gt;data;\n    }\n    return total;\n}\n\nint count_value(node *head, int value) {\n    int count = 0;\n    for (node *curr = head; curr != NULL; curr = curr-&gt;next) {\n        if (curr-&gt;data == value) {\n            count++;\n        }\n    }\n    return count;\n}\n\nint contains(node *head, int value) {\n    for (node *curr = head; curr != NULL; curr = curr-&gt;next) {\n        if (curr-&gt;data == value) {\n            return 1;\n        }\n    }\n    return 0;\n}\n\nint list_max(node *head) {          // assumes head != NULL\n    int max = head-&gt;data;\n    for (node *curr = head-&gt;next; curr != NULL; curr = curr-&gt;next) {\n        if (curr-&gt;data &gt; max) {\n            max = curr-&gt;data;\n        }\n    }\n    return max;\n}\u003c/pre>\n\u003ch3>TEMPLATE 14.2: print and free\u003c/h3>\n\u003cpre>void print_list(node *head) {        // prints 1 -&gt; 5 -&gt; 3 -&gt; X\n    for (node *curr = head; curr != NULL; curr = curr-&gt;next) {\n        printf(\"%d -&gt; \", curr-&gt;data);\n    }\n    printf(\"X\\n\");\n}\n\nvoid free_list(node *head) {\n    node *curr = head;\n    while (curr != NULL) {\n        node *next = curr-&gt;next;     // save first\n        free(curr);\n        curr = next;\n    }\n}\u003c/pre>\n\u003ch3>TEMPLATE 14.3: node at index (0-based), or NULL\u003c/h3>\n\u003cpre>node *get_nth(node *head, int n) {\n    node *curr = head;\n    int i = 0;\n    while (curr != NULL &amp;&amp; i &lt; n) {\n        curr = curr-&gt;next;\n        i++;\n    }\n    return curr;\n}\u003c/pre>\n\u003ch2>14.3 Pattern 1b: pairs (Q1 type)\u003c/h2>\n\u003ch3>TEMPLATE 14.4: count \"X followed by Y\"\u003c/h3>\n\u003cpre>int is_vowel(char c) {\n    return c == 'a' || c == 'e' || c == 'i' || c == 'o' || c == 'u';\n}\n\nint count_vowel_word_boundaries(struct node *head) {   // char data\n    if (head == NULL) {\n        return -1;                         // spec: empty list\n    }\n    int count = 0;\n    struct node *curr = head;\n    while (curr-&gt;next != NULL) {           // safe: head was not NULL\n        if (is_vowel(curr-&gt;data) &amp;&amp; !is_vowel(curr-&gt;next-&gt;data)) {\n            count++;\n        }\n        curr = curr-&gt;next;\n    }\n    return count;\n}\u003c/pre>\n\u003cp class=\"ex\">\u003cb>Example.\u003c/b> b e a u t i f u l: pairs where a vowel is followed by a consonant are u-t, i-f, u-l, so the answer is 3. e-a and a-u are vowel-vowel (no). Empty list: -1. One node: 0.\u003c/p>\n\u003ch2>14.4 Building lists\u003c/h2>\n\u003ch3>TEMPLATE 14.5: create, prepend, append\u003c/h3>\n\u003cpre>node *create_node(int data, node *next) {\n    node *new = malloc(sizeof(node));\n    new-&gt;data = data;\n    new-&gt;next = next;\n    return new;\n}\n\nnode *prepend(node *head, int data) {      // insert at head\n    return create_node(data, head);\n}\n\nnode *append(node *head, int data) {       // insert at tail\n    node *new = create_node(data, NULL);\n    if (head == NULL) {\n        return new;\n    }\n    node *curr = head;\n    while (curr-&gt;next != NULL) {           // stop ON the last node\n        curr = curr-&gt;next;\n    }\n    curr-&gt;next = new;\n    return head;                           // NOT new\n}\u003c/pre>\n\u003cp>\u003cb>Rote:\u003c/b> prepend reverses input order; append keeps it. Reading 1 2 3 with prepend gives 3 -&gt; 2 -&gt; 1 -&gt; X.\u003c/p>\n\u003ch2>14.5 Pattern 2: look ahead with prev (Q3 type)\u003c/h2>\n\u003ch3>TEMPLATE 14.6: delete first match\u003c/h3>\n\u003cpre>node *delete_first(node *head, int value) {\n    if (head == NULL) {\n        return NULL;\n    }\n    if (head-&gt;data == value) {                 // CASE 1: head\n        node *new_head = head-&gt;next;\n        free(head);\n        return new_head;\n    }\n    node *prev = head;                         // CASE 2: later node\n    while (prev-&gt;next != NULL) {\n        if (prev-&gt;next-&gt;data == value) {\n            node *to_delete = prev-&gt;next;\n            prev-&gt;next = to_delete-&gt;next;\n            free(to_delete);\n            return head;\n        }\n        prev = prev-&gt;next;\n    }\n    return head;                               // not found\n}\u003c/pre>\n\u003cpre>Trace: delete 5 from 1 -&gt; 5 -&gt; 3 -&gt; X\nprev = [1]          prev-&gt;next is [5]: match\nto_delete = [5]\nprev-&gt;next = [3]    list is now 1 -&gt; 3 -&gt; X\nfree([5])\u003c/pre>\n\u003ch3>TEMPLATE 14.7: delete ALL matches\u003c/h3>\n\u003cpre>node *delete_all(node *head, int value) {\n    while (head != NULL &amp;&amp; head-&gt;data == value) {   // while, not if\n        node *to_delete = head;\n        head = head-&gt;next;\n        free(to_delete);\n    }\n    if (head == NULL) {\n        return NULL;\n    }\n    node *prev = head;\n    while (prev-&gt;next != NULL) {\n        if (prev-&gt;next-&gt;data == value) {\n            node *to_delete = prev-&gt;next;\n            prev-&gt;next = to_delete-&gt;next;\n            free(to_delete);                // do NOT move prev\n        } else {\n            prev = prev-&gt;next;\n        }\n    }\n    return head;\n}\u003c/pre>\n\u003cp class=\"ex\">\u003cb>Example.\u003c/b> 4 -&gt; 4 -&gt; 1 -&gt; 4 -&gt; 4 -&gt; X, delete all 4: head loop removes two, middle loop removes two, result 1 -&gt; X.\u003c/p>\n\u003ch3>TEMPLATE 14.8: delete by neighbour condition (first local maximum)\u003c/h3>\n\u003cpre>node *delete_first_local_max(node *head) {\n    if (head == NULL) {\n        return NULL;\n    }\n    node *prev = head;\n    while (prev-&gt;next != NULL &amp;&amp; prev-&gt;next-&gt;next != NULL) {\n        node *curr = prev-&gt;next;\n        if (curr-&gt;data &gt; prev-&gt;data &amp;&amp; curr-&gt;data &gt; curr-&gt;next-&gt;data) {\n            prev-&gt;next = curr-&gt;next;\n            free(curr);\n            return head;\n        }\n        prev = curr;\n    }\n    return head;\n}\u003c/pre>\n\u003cp>\u003cb>Why no head case:\u003c/b> a local max needs a node before AND after, so head and tail never qualify. Three pointers in view: prev, curr = prev-&gt;next, curr-&gt;next.\u003c/p>\n\u003cp class=\"ex\">\u003cb>Example.\u003c/b> 1 -&gt; 5 -&gt; 3 -&gt; 7 -&gt; 2: first local max is 5, result 1 -&gt; 3 -&gt; 7 -&gt; 2. Calling again removes 7. Then 1 -&gt; 3 -&gt; 2 removes 3. Then 1 -&gt; 2 is unchanged.\u003c/p>\n\u003ch3>TEMPLATE 14.9: delete the LAST match\u003c/h3>\n\u003cpre>node *delete_last(node *head, int value) {\n    if (head == NULL) {\n        return NULL;\n    }\n    node *before_last = NULL;\n    for (node *prev = head; prev-&gt;next != NULL; prev = prev-&gt;next) {\n        if (prev-&gt;next-&gt;data == value) {\n            before_last = prev;             // remember, keep going\n        }\n    }\n    if (before_last != NULL) {\n        node *to_delete = before_last-&gt;next;\n        before_last-&gt;next = to_delete-&gt;next;\n        free(to_delete);\n    } else if (head-&gt;data == value) {       // only match is the head\n        node *new_head = head-&gt;next;\n        free(head);\n        return new_head;\n    }\n    return head;\n}\u003c/pre>\n\u003ch3>TEMPLATE 14.10: delete node at index\u003c/h3>\n\u003cpre>node *delete_at(node *head, int index) {\n    if (head == NULL || index &lt; 0) {\n        return head;\n    }\n    if (index == 0) {\n        node *new_head = head-&gt;next;\n        free(head);\n        return new_head;\n    }\n    node *prev = head;\n    for (int i = 0; i &lt; index - 1 &amp;&amp; prev-&gt;next != NULL; i++) {\n        prev = prev-&gt;next;\n    }\n    if (prev-&gt;next != NULL) {\n        node *to_delete = prev-&gt;next;\n        prev-&gt;next = to_delete-&gt;next;\n        free(to_delete);\n    }\n    return head;\n}\u003c/pre>\n\u003ch2>14.6 Inserting\u003c/h2>\n\u003ch3>TEMPLATE 14.11: insert in sorted (ascending) order\u003c/h3>\n\u003cpre>node *insert_sorted(node *head, int data) {\n    if (head == NULL || data &lt; head-&gt;data) {\n        return prepend(head, data);\n    }\n    node *prev = head;\n    while (prev-&gt;next != NULL &amp;&amp; prev-&gt;next-&gt;data &lt;= data) {\n        prev = prev-&gt;next;\n    }\n    prev-&gt;next = create_node(data, prev-&gt;next);\n    return head;\n}\u003c/pre>\n\u003ch3>TEMPLATE 14.12: insert at index (past the end appends)\u003c/h3>\n\u003cpre>node *insert_at(node *head, int index, int data) {\n    if (index &lt;= 0 || head == NULL) {\n        return prepend(head, data);\n    }\n    node *prev = head;\n    int i = 0;\n    while (prev-&gt;next != NULL &amp;&amp; i &lt; index - 1) {\n        prev = prev-&gt;next;\n        i++;\n    }\n    prev-&gt;next = create_node(data, prev-&gt;next);\n    return head;\n}\u003c/pre>\n\u003ch3>TEMPLATE 14.13: insert after every matching node\u003c/h3>\n\u003cpre>node *duplicate_evens(node *head) {\n    node *curr = head;\n    while (curr != NULL) {\n        if (curr-&gt;data % 2 == 0) {\n            curr-&gt;next = create_node(curr-&gt;data, curr-&gt;next);\n            curr = curr-&gt;next-&gt;next;     // jump over the new copy\n        } else {\n            curr = curr-&gt;next;\n        }\n    }\n    return head;\n}\u003c/pre>\n\u003ch2>14.7 Restructuring\u003c/h2>\n\u003ch3>TEMPLATE 14.14: reverse (three pointers)\u003c/h3>\n\u003cpre>node *reverse(node *head) {\n    node *prev = NULL;\n    node *curr = head;\n    while (curr != NULL) {\n        node *next = curr-&gt;next;   // 1. save\n        curr-&gt;next = prev;         // 2. flip\n        prev = curr;               // 3. step prev\n        curr = next;               // 4. step curr\n    }\n    return prev;                   // new head\n}\u003c/pre>\n\u003cp>\u003cb>Rote:\u003c/b> \"save, flip, step, step, return prev\".\u003c/p>\n\u003ch3>TEMPLATE 14.15: copy with a tail pointer\u003c/h3>\n\u003cpre>node *copy_list(node *head) {\n    if (head == NULL) {\n        return NULL;\n    }\n    node *new_head = create_node(head-&gt;data, NULL);\n    node *tail = new_head;\n    for (node *curr = head-&gt;next; curr != NULL; curr = curr-&gt;next) {\n        tail-&gt;next = create_node(curr-&gt;data, NULL);\n        tail = tail-&gt;next;\n    }\n    return new_head;\n}\u003c/pre>\n\u003ch3>TEMPLATE 14.16: merge two sorted lists (no malloc)\u003c/h3>\n\u003cpre>node *merge_sorted(node *a, node *b) {\n    if (a == NULL) {\n        return b;\n    }\n    if (b == NULL) {\n        return a;\n    }\n    node *head;\n    if (a-&gt;data &lt;= b-&gt;data) {\n        head = a;\n        a = a-&gt;next;\n    } else {\n        head = b;\n        b = b-&gt;next;\n    }\n    node *tail = head;\n    while (a != NULL &amp;&amp; b != NULL) {\n        if (a-&gt;data &lt;= b-&gt;data) {\n            tail-&gt;next = a;\n            a = a-&gt;next;\n        } else {\n            tail-&gt;next = b;\n            b = b-&gt;next;\n        }\n        tail = tail-&gt;next;\n    }\n    if (a != NULL) {\n        tail-&gt;next = a;\n    } else {\n        tail-&gt;next = b;\n    }\n    return head;\n}\u003c/pre>\n\u003ch3>TEMPLATE 14.17: remove adjacent duplicates\u003c/h3>\n\u003cpre>node *remove_adjacent_duplicates(node *head) {\n    node *curr = head;\n    while (curr != NULL &amp;&amp; curr-&gt;next != NULL) {\n        if (curr-&gt;next-&gt;data == curr-&gt;data) {\n            node *to_delete = curr-&gt;next;\n            curr-&gt;next = to_delete-&gt;next;\n            free(to_delete);\n        } else {\n            curr = curr-&gt;next;\n        }\n    }\n    return head;\n}\u003c/pre>\n\u003ch2>14.8 Q8 pattern: read characters into a list\u003c/h2>\n\u003cpre>int main(void) {\n    node *head = NULL;\n    int c = getchar();\n    while (c != EOF) {\n        if (c &gt;= '0' &amp;&amp; c &lt;= '9') {\n            head = prepend(head, c - '0');   // at the head: reverse order\n        } else if (c != '\\n') {\n            printf(\"Error: '%c' is not a digit\\n\", c);   // copy spec text\n        }\n        c = getchar();\n    }\n    print_list(head);\n    free_list(head);\n    return 0;\n}\u003c/pre>\n\u003ch2>14.9 Q10 and Q11: bigger structs\u003c/h2>\n\u003col class=\"rules\">\n\u003cli>\u003cspan class=\"r\">R14.16\u003c/span> Draw the list for the sample input BEFORE coding. Then draw it after the operation.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.17\u003c/span> Split the problem into helpers: \u003cspan class=\"mono\">find_at(head, pos)\u003c/span>, \u003cspan class=\"mono\">group_total(start)\u003c/span>, \u003cspan class=\"mono\">set_group(start, value)\u003c/span>. Test each by printing.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.18\u003c/span> \"Groups connected by open passages\": walk from head, remember where the current group starts (reset when you pass a closed passage), sum the group in one pass, write the shared value in a second pass.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.19\u003c/span> Lists inside structs (Q11): each outer node holds a head pointer of an inner list. Use the same templates on \u003cspan class=\"mono\">outer-&gt;inner_head\u003c/span>, and assign the returned head back: \u003cspan class=\"mono\">cell-&gt;states = delete_first(cell-&gt;states, s);\u003c/span>.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.20\u003c/span> Keep sorted lists sorted: always insert with TEMPLATE 14.11.\u003c/li>\n\u003cli>\u003cspan class=\"r\">R14.21\u003c/span> Partial marks count. Get the simplest case passing and submit before handling edge cases.\u003c/li>\n\u003c/ol>\n\u003ch3>Rote summary of list loop conditions\u003c/h3>\n\u003ctable>\n\u003ctr>\u003cth>You want\u003c/th>\u003cth>Loop condition\u003c/th>\u003cth>After loop\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Visit every node\u003c/td>\u003ctd class=\"mono\">curr != NULL\u003c/td>\u003ctd>curr is NULL\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Stop on last node\u003c/td>\u003ctd class=\"mono\">curr-&gt;next != NULL\u003c/td>\u003ctd>curr is the tail\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Look at pairs (may be empty)\u003c/td>\u003ctd class=\"mono\">curr != NULL &amp;&amp; curr-&gt;next != NULL\u003c/td>\u003ctd>-\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Delete/insert after prev\u003c/td>\u003ctd class=\"mono\">prev-&gt;next != NULL\u003c/td>\u003ctd>prev is the tail\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Look at triples\u003c/td>\u003ctd class=\"mono\">prev-&gt;next != NULL &amp;&amp; prev-&gt;next-&gt;next != NULL\u003c/td>\u003ctd>-\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Stop at index n\u003c/td>\u003ctd class=\"mono\">curr != NULL &amp;&amp; i &lt; n\u003c/td>\u003ctd>curr is node n or NULL\u003c/td>\u003c/tr>\n\u003c/table>"},{"num":15,"title":"Debugging: the bug catalogue","html":"\u003cp>Q5 to Q8 each hide about 3 to 5 bugs. Read every line looking for the 25 bugs below. Fix them one at a time and re-run.\u003c/p>\n\u003ch3>The bug hunt order\u003c/h3>\n\u003col>\n\u003cli>Compile with dcc. Fix the FIRST error, recompile. Read every warning: each one is usually a bug.\u003c/li>\n\u003cli>Run the sample input. Compare output character by character (spaces, capitals, punctuation, newline at the end).\u003c/li>\n\u003cli>Scan the code against the catalogue below.\u003c/li>\n\u003cli>Test edge inputs: CTRL+D immediately, invalid input, smallest and largest values.\u003c/li>\n\u003cli>Autotest, then submit.\u003c/li>\n\u003c/ol>\n\u003ctable>\n\u003ctr>\u003cth>#\u003c/th>\u003cth>Bug\u003c/th>\u003cth>Wrong\u003c/th>\u003cth>Right\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Missing &amp; in scanf\u003c/td>\u003ctd class=\"mono\">scanf(\"%d\", n)\u003c/td>\u003ctd class=\"mono\">scanf(\"%d\", &amp;n)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Wrong specifier\u003c/td>\u003ctd class=\"mono\">scanf(\"%d\", &amp;dbl)\u003c/td>\u003ctd class=\"mono\">scanf(\"%lf\", &amp;dbl)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Assign in condition\u003c/td>\u003ctd class=\"mono\">if (x = 0)\u003c/td>\u003ctd class=\"mono\">if (x == 0)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Stray semicolon\u003c/td>\u003ctd class=\"mono\">while (i &lt; n);\u003c/td>\u003ctd class=\"mono\">while (i &lt; n)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Integer division\u003c/td>\u003ctd class=\"mono\">avg = sum / n;\u003c/td>\u003ctd class=\"mono\">avg = (double) sum / n;\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Off by one (end)\u003c/td>\u003ctd class=\"mono\">i &lt;= size\u003c/td>\u003ctd class=\"mono\">i &lt; size\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>7\u003c/td>\u003ctd>Off by one (start)\u003c/td>\u003ctd class=\"mono\">for (i = 1; ...)\u003c/td>\u003ctd class=\"mono\">for (i = 0; ...)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>8\u003c/td>\u003ctd>Wrong &gt; vs &gt;=\u003c/td>\u003ctd class=\"mono\">if (mark &gt; 85)\u003c/td>\u003ctd class=\"mono\">if (mark &gt;= 85)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>9\u003c/td>\u003ctd>if/else if order\u003c/td>\u003ctd class=\"mono\">&gt;= 50 before &gt;= 65\u003c/td>\u003ctd>largest threshold first\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>10\u003c/td>\u003ctd>&amp;&amp; vs || in range\u003c/td>\u003ctd class=\"mono\">x &lt; 0 &amp;&amp; x &gt; 100\u003c/td>\u003ctd class=\"mono\">x &lt; 0 || x &gt; 100\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>11\u003c/td>\u003ctd>Uninitialised\u003c/td>\u003ctd class=\"mono\">int sum;\u003c/td>\u003ctd class=\"mono\">int sum = 0;\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>12\u003c/td>\u003ctd>Wrong start value\u003c/td>\u003ctd class=\"mono\">int count = 1;\u003c/td>\u003ctd class=\"mono\">int count = 0;\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>13\u003c/td>\u003ctd>Max/min starting at 0\u003c/td>\u003ctd class=\"mono\">int min = 0;\u003c/td>\u003ctd class=\"mono\">int min = array[0];\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>14\u003c/td>\u003ctd>Wrong scanf loop\u003c/td>\u003ctd class=\"mono\">while (scanf(...) != 0)\u003c/td>\u003ctd class=\"mono\">while (scanf(...) == 1)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>15\u003c/td>\u003ctd>getchar into char\u003c/td>\u003ctd class=\"mono\">char c = getchar();\u003c/td>\u003ctd class=\"mono\">int c = getchar();\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>16\u003c/td>\u003ctd>Missing newline\u003c/td>\u003ctd class=\"mono\">printf(\"FL\");\u003c/td>\u003ctd class=\"mono\">printf(\"FL\\n\");\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>17\u003c/td>\u003ctd>Missing * on output param\u003c/td>\u003ctd class=\"mono\">area = l * w;\u003c/td>\u003ctd class=\"mono\">*area = l * w;\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>18\u003c/td>\u003ctd>Swapped outputs\u003c/td>\u003ctd class=\"mono\">*min = largest;\u003c/td>\u003ctd class=\"mono\">*min = smallest;\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>19\u003c/td>\u003ctd>Value not address\u003c/td>\u003ctd class=\"mono\">f(l, w, p, a)\u003c/td>\u003ctd class=\"mono\">f(l, w, &amp;p, &amp;a)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>20\u003c/td>\u003ctd>Wrong malloc size\u003c/td>\u003ctd class=\"mono\">malloc(sizeof(node *))\u003c/td>\u003ctd class=\"mono\">malloc(sizeof(node))\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>21\u003c/td>\u003ctd>Append returns new\u003c/td>\u003ctd class=\"mono\">return new;\u003c/td>\u003ctd class=\"mono\">return head;\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>22\u003c/td>\u003ctd>Print skips last node\u003c/td>\u003ctd class=\"mono\">while (curr-&gt;next != NULL)\u003c/td>\u003ctd class=\"mono\">while (curr != NULL)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>23\u003c/td>\u003ctd>Use after free\u003c/td>\u003ctd class=\"mono\">free(h); h = h-&gt;next;\u003c/td>\u003ctd class=\"mono\">next = h-&gt;next; free(h); h = next;\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>24\u003c/td>\u003ctd>Head not updated\u003c/td>\u003ctd class=\"mono\">prepend(head, x);\u003c/td>\u003ctd class=\"mono\">head = prepend(head, x);\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>25\u003c/td>\u003ctd>String compare\u003c/td>\u003ctd class=\"mono\">if (s == \"yes\")\u003c/td>\u003ctd class=\"mono\">if (strcmp(s, \"yes\") == 0)\u003c/td>\u003c/tr>\n\u003c/table>\n\u003ch3>dcc messages decoded\u003c/h3>\n\u003ctable>\n\u003ctr>\u003cth>Message says\u003c/th>\u003cth>It means\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>index N out of bounds for type 'int [N]'\u003c/td>\u003ctd>loop goes one too far (bug 6)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>accessing a field via a NULL pointer\u003c/td>\u003ctd>\u003cspan class=\"mono\">curr-&gt;\u003c/span> when curr is NULL; fix the loop condition\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>variable is uninitialized when used\u003c/td>\u003ctd>bug 11\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>using the value of an assignment as a condition\u003c/td>\u003ctd>bug 3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>format specifies type 'int' but the argument has type 'double'\u003c/td>\u003ctd>bug 2\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>control reaches end of non-void function\u003c/td>\u003ctd>a path with no return\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>implicit declaration of function\u003c/td>\u003ctd>missing #include or prototype\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>heap-use-after-free\u003c/td>\u003ctd>bug 23\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>memory leak / not freed\u003c/td>\u003ctd>missing free\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>program seems stuck / no output\u003c/td>\u003ctd>infinite loop (bug 4, 14, or missing update)\u003c/td>\u003c/tr>\n\u003c/table>\n\u003ch3>Worked example: fix four bugs\u003c/h3>\n\u003cpre>// BUGGY                                   // FIXED\nint count = 1;                             int count = 0;\nwhile (scanf(\"%d\", &amp;x) != 0) {             while (scanf(\"%d\", &amp;x) == 1) {\n    sum += x; count++;                         sum += x; count++;\n}                                          }\nif (count = 0) {                           if (count == 0) {\n    printf(\"No numbers entered\\n\");            printf(\"No numbers entered\\n\");\n} else {                                   } else {\n    double average = sum / count;              double average = (double) sum / count;\n}                                          }\u003c/pre>"},{"num":16,"title":"Edge cases and the exam-day algorithm","html":"\u003ch3>Edge cases to test (rote this table)\u003c/h3>\n\u003ctable>\n\u003ctr>\u003cth>Question type\u003c/th>\u003cth>Always test\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1D array\u003c/td>\u003ctd>size 1; all equal; all negative; zero; answer at index 0; answer at last index; no answer\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2D array\u003c/td>\u003ctd>smallest size (often 2x2 or 1x1); largest (100x100); no answer (-1); answer in a corner; odd and even size\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>List counting\u003c/td>\u003ctd>empty (often -1); one node (0 pairs); match at the very end\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>List deleting\u003c/td>\u003ctd>empty; one node; target is head; target is tail; target absent; several targets in a row; all nodes match\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>List inserting\u003c/td>\u003ctd>empty list; insert before head; insert after tail; equal values\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Strings\u003c/td>\u003ctd>empty line; one character; maximum length; z wrap-around; upper case; spaces\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Input programs\u003c/td>\u003ctd>CTRL+D straight away; invalid input; exact sample; negative numbers\u003c/td>\u003c/tr>\n\u003c/table>\n\u003ch3>The exam-day algorithm for one question\u003c/h3>\n\u003col>\n\u003cli>Read the spec twice. Underline: return value for empty/none, restrictions, exact output text.\u003c/li>\n\u003cli>Write 3 test cases on paper including one edge case. Work out the expected answer by hand.\u003c/li>\n\u003cli>Pick the template from this book. Write it in.\u003c/li>\n\u003cli>Compile with dcc, fix warnings.\u003c/li>\n\u003cli>Run your own tests, then autotest.\u003c/li>\n\u003cli>Submit. Then think of one more edge case; if it fails, fix and resubmit.\u003c/li>\n\u003c/ol>\n\u003ch3>Ten commandments (rote)\u003c/h3>\n\u003col>\n\u003cli>Submit early, submit often.\u003c/li>\n\u003cli>Check NULL before -&gt;.\u003c/li>\n\u003cli>Save next before free.\u003c/li>\n\u003cli>Head changes? Return it, and assign it.\u003c/li>\n\u003cli>Max starts at element 0.\u003c/li>\n\u003cli>Neighbour loops stop at size - 1.\u003c/li>\n\u003cli>scanf returns a count; loop while it equals 1.\u003c/li>\n\u003cli>Strings end with '\\0'; buffers are length + 1.\u003c/li>\n\u003cli>Return means return, not print.\u003c/li>\n\u003cli>Copy output text from the spec, never retype it.\u003c/li>\n\u003c/ol>"}]</script>

n class=\"mono\">a = b\u003c/span> for arrays?","a":"no, copy element by element"},{"section":"Arrays","q":"Why initialise max with array[0], not 0?","a":"all values could be negative"},{"section":"Arrays","q":"Loop bound when comparing a[i] with a[i+1]?","a":"i &lt; size - 1"},{"section":"Arrays","q":"Number of swaps to reverse 7 elements?","a":"3 (7 / 2)"},{"section":"Arrays","q":"Does a function see changes to an array parameter?","a":"yes: arrays are passed as addresses"},{"section":"Arrays","q":"Why pass size with an array?","a":"the function cannot know the length; sizeof gives pointer size"},{"section":"Arrays","q":"In \u003cspan class=\"mono\">grid[r][c]\u003c/span>, which is the row?","a":"r (first index)"},{"section":"Arrays","q":"Anti-diagonal condition in n x n?","a":"row + col == n - 1"},{"section":"Arrays","q":"Border cell condition?","a":"row == 0 || row == n-1 || col == 0 || col == n-1"},{"section":"Arrays","q":"How do you make sure corners are counted once?","a":"visit every cell once and test the border condition"},{"section":"Arrays","q":"Centre cell of a 5x5?","a":"[2][2]"},{"section":"Arrays","q":"Diagonal sum of 3x3: how many cells?","a":"5 (centre counted once)"},{"section":"Arrays","q":"Bounds test for neighbour (nr, nc)?","a":"nr &gt;= 0 &amp;&amp; nr &lt; n &amp;&amp; nc &gt;= 0 &amp;&amp; nc &lt; n"},{"section":"Arrays","q":"Saddle point definition (Q4)?","a":"smallest in its row AND largest in its column"},{"section":"Strings, pointers, memory","q":"strlen(\"hello\")?","a":"5"},{"section":"Strings, pointers, memory","q":"Bytes needed to store \"hello\"?","a":"6"},{"section":"Strings, pointers, memory","q":"Value of '\\0'?","a":"0"},{"section":"Strings, pointers, memory","q":"Compare two strings for equality?","a":"strcmp(a, b) == 0"},{"section":"Strings, pointers, memory","q":"Last line when building a string by hand?","a":"result[pos] = '\\0';"},{"section":"Strings, pointers, memory","q":"malloc size for a string of length L?","a":"L + 1"},{"section":"Strings, pointers, memory","q":"What does &amp;x give?","a":"the address of x"},{"section":"Strings, pointers, memory","q":"What does *p give?","a":"the value p points to"},{"section":"Strings, pointers, memory","q":"p-&gt;x is short for?","a":"(*p).x"},{"section":"Strings, pointers, memory","q":"Inside \u003cspan class=\"mono\">void f(int *out)\u003c/span>, how to set the caller's variable to 5?","a":"*out = 5;"},{"section":"Strings, pointers, memory","q":"How to call f on variable n?","a":"f(&amp;n);"},{"section":"Strings, pointers, memory","q":"malloc for one node?","a":"malloc(sizeof(node))"},{"section":"Strings, pointers, memory","q":"What is wrong with malloc(sizeof(node *))?","a":"only 8 bytes, too small"},{"section":"Strings, pointers, memory","q":"What does malloc return on failure?","a":"NULL"},{"section":"Strings, pointers, memory","q":"Correct realloc pattern?","a":"temp = realloc(a, n); if (temp != NULL) a = temp;"},{"section":"Strings, pointers, memory","q":"Can you return a local array from a function?","a":"no; malloc it"},{"section":"Linked lists","q":"Empty list is represented by?","a":"head == NULL"},{"section":"Linked lists","q":"Loop to visit every node?","a":"while (curr != NULL)"},{"section":"Linked lists","q":"Loop to stop ON the last node?","a":"while (curr-&gt;next != NULL)"},{"section":"Linked lists","q":"Why does delete need prev?","a":"must change the link INTO the deleted node"},{"section":"Linked lists","q":"Three steps of delete?","a":"to_delete = prev-&gt;next; prev-&gt;next = to_delete-&gt;next; free(to_delete);"},{"section":"Linked lists","q":"Two steps of insert after prev (order)?","a":"new-&gt;next = prev-&gt;next; then prev-&gt;next = new;"},{"section":"Linked lists","q":"Special case in every delete/insert?","a":"the head"},{"section":"Linked lists","q":"In delete_all, the head case uses if or while?","a":"while"},{"section":"Linked lists","q":"In delete_all, move prev after deleting?","a":"no"},{"section":"Linked lists","q":"What must the caller write after \u003cspan class=\"mono\">delete_first(head, 5)\u003c/span>?","a":"head = delete_first(head, 5);"},{"section":"Linked lists","q":"Why no head case in delete_first_local_max?","a":"head and tail can never be local maxima"},{"section":"Linked lists","q":"Prepending 1, 2, 3 gives?","a":"3 -&gt; 2 -&gt; 1 -&gt; X"},{"section":"Linked lists","q":"Four lines inside the reverse loop?","a":"next = curr-&gt;next; curr-&gt;next = prev; prev = curr; curr = next;"},{"section":"Linked lists","q":"What does reverse return?","a":"prev"}]</script>
