          var v = first ? first.verdict : 'TLE';
          vb.className = 'verdict v-' + v;
          vb.innerHTML = '<span class="big">' + VERDICT_NAME[v] + '</span><span class="sub">' + passed + '/' + total + ' tests passed' + (first ? ', first failure on test #' + (first.i + 1) : '') + (slot ? ' · exam score ' + (Math.round(slot.marks * frac * 10) / 10) + '/' + slot.marks : '') + '</span>';
          rs.forEach(function (x) { if (!x) return; });
          if (first) showTest(first);
        }
        save(); renderBar();
        $all('#tgrid .tc', view).forEach(function (b) { b.addEventListener('click', function () { var it = results[+b.getAttribute('data-i')]; if (it) showTest(it); }); });
      });
      function showTest(item) {
        $all('#tgrid .tc', view).forEach(function (b) { b.classList.toggle('sel', +b.getAttribute('data-i') === item.i); });
        var t = p.tests[item.i];
        var h = '<div class="small muted" style="margin-bottom:6px">Test #' + (item.i + 1) + (t.sample ? ' (sample)' : ' (hidden test, shown so you can learn from it)') + ': <b>' + VERDICT_NAME[item.verdict] + '</b></div>';
        if (item.verdict === 'RE' || item.verdict === 'TLE') { h += errHtml(item.error, item.verdict === 'RE' ? 'runtime' : 'tle'); clearErr(cm); markErr(cm, item.error && item.error.line); }
        if (item.verdict === 'LEAK') h += leakHtml(item.leaks, true);
        h += '<div class="io-h">Input <button class="btn small" id="useInput">Use as input</button></div><pre class="box">' + (t.input ? esc(t.input) : '<span class="muted">(empty input)</span>') + '</pre>';
        h += diffHtml(t.output, item.stdout || '');
        $('#tdetail').innerHTML = h;
        var ub = $('#useInput'); if (ub) ub.addEventListener('click', function () { $('#stdin').value = t.input; tab('input'); });
      }
    }
    $('#runBtn').addEventListener('click', doRun);
    $('#submitBtn').addEventListener('click', doSubmit);
  }
  function nextLinks(p) {
    var i = PROBLEMS.indexOf(p), nx = PROBLEMS[i + 1];
    var h = '<p>Well done. Read the model solution in the problem panel and compare it with yours.</p><div class="quick">';
    if (nx) h += '<a class="btn primary" href="#' + hashOf(nx.id) + '">Next: ' + esc(nx.title) + '</a>';
    if (S.exam && Date.now() - S.exam.start < EXAM_MS) h += '<a class="btn" href="#exam">Back to the exam</a>';
    return h + '<a class="btn" href="#practice">All problems</a></div>';
  }
  function errHtml(err, kind) {
    if (!err) return '';
    var cls = kind === 'compile' ? '' : kind === 'tle' ? ' warn' : ' re';
    var label = kind === 'compile' ? 'error' : kind === 'tle' ? 'time limit' : 'runtime error';
    var loc = err.line ? 'line ' + err.line + (err.col ? ':' + err.col : '') + ': ' : '';
    var src = err.text ? '<pre>' + esc(err.text) + (kind === 'compile' && err.col ? '\n' + ' '.repeat(Math.max(0, err.col - 1)) + '^' : '') + '</pre>' : '';
    return '<div class="errbox' + cls + '"><span class="loc">' + esc(loc) + label + ':</span> ' + esc(err.msg) + src + '</div>';
  }
  function leakHtml(leaks, fail) {
    if (!leaks || !leaks.length) return '';
    var n = leaks.reduce(function (s, l) { return s + l.count; }, 0), b = leaks.reduce(function (s, l) { return s + l.bytes; }, 0);
    return '<div class="errbox warn"><span class="loc">memory leak:</span> ' + n + ' block' + (n === 1 ? '' : 's') + ' (' + b + ' bytes) malloc\'d but never freed. Allocated at ' + leaks.map(function (l) { return 'line ' + l.line + (l.count > 1 ? ' (x' + l.count + ')' : ''); }).join(', ') + '.' + (fail ? ' This problem requires freeing everything.' : '') + '</div>';
  }
  function diffHtml(exp, got) {
    var a = norm(exp).split('\n'), b = norm(got).split('\n');
    if (norm(got) === '') b = [];
    var n = Math.max(a.length, b.length), firstBad = -1;
    for (var i = 0; i < n; i++) if (a[i] !== b[i]) { firstBad = i; break; }
    function col(lines, other) {
      return lines.map(function (l, i) { return '<div' + (l !== other[i] ? ' class="x"' : '') + '><span class="ln">' + (i + 1) + '</span>' + esc(l) + '</div>'; }).join('') || '<div class="muted">&nbsp;(no output)</div>';
    }
    var note = firstBad >= 0 ? '<p class="small muted">First difference on line ' + (firstBad + 1) + '. Spaces at the end of lines and blank lines at the end are ignored.</p>' : '';
    return '<div class="diffgrid"><div class="io"><div class="io-h">Expected output</div><div class="dl">' + col(a, b) + '</div></div><div class="io"><div class="io-h">Your output</div><div class="dl">' + col(b, a) + '</div></div></div>' + note;
  }
  function showRun(pane, r, cm) {
    var h = '';
    var label = r.status === 'OK' ? 'Finished' : VERDICT_NAME[r.status] || r.status;
    var cls = r.status === 'OK' ? 'v-AC' : 'v-' + r.status;
    h += '<div class="verdict ' + cls + '"><span class="big">' + label + '</span><span class="sub">' + (r.status === 'OK' ? 'exit code ' + r.exitCode + ' · ' : '') + (r.ms != null ? r.ms + ' ms' : '') + '</span></div>';
    if (r.status === 'CE') { h += errHtml(r.error, 'compile'); markErr(cm, r.error.line); }
    if (r.status === 'RE' || r.status === 'TLE') { h += errHtml(r.error, r.status === 'RE' ? 'runtime' : 'tle'); markErr(cm, r.error && r.error.line); }
    (r.warnings || []).forEach(function (w) { h += '<div class="errbox warn"><span class="loc">line ' + w.line + ': warning:</span> ' + esc(w.msg) + '</div>'; });
    h += leakHtml(r.leaks, false);
    if (r.status !== 'CE') h += '<div class="io-h">Output</div><pre class="box">' + (r.stdout ? esc(r.stdout) : '<span class="muted">(no output)</span>') + '</pre>';
    if (r.stderr) h += '<div class="io-h" style="margin-top:8px">stderr</div><pre class="box">' + esc(r.stderr) + '</pre>';
    pane.innerHTML = h;
  }

  // ---------------------------------------------------------------- exam
  function renderExam() {
    document.title = 'Mock exam · Hurdle';
    var active = S.exam && Date.now() - S.exam.start < EXAM_MS;
    if (!S.exam) {
      view.innerHTML = '<h1>Mock exam</h1><p class="lede">Eleven questions in the final-exam layout, 3 hours on the clock. Your score for each question is its marks times the fraction of tests your best submission passes. Hurdles need a fully passing array question (Q2 or Q4) and list question (Q1 or Q3).</p>' +
        '<div class="home-grid">' + Object.keys(EXAMS).map(function (k) {
          var ex = EXAMS[k];
          return '<section class="panel"><h2>' + esc(ex.name) + '</h2><table class="paper"><tbody>' + ex.slots.map(function (s, i) { var p = BY_ID[s[0]]; return '<tr' + (s[2] ? ' class="hurdle"' : '') + '><td>Q' + (i + 1) + '</td><td>' + esc(p.title) + '</td><td class="num">' + s[1] + '</td></tr>'; }).join('') + '</tbody></table><div class="quick"><button class="btn primary" data-start="' + k + '">Start ' + esc(ex.name) + '</button></div></section>';
        }).join('') + '</div>';
      $all('[data-start]', view).forEach(function (b) { b.addEventListener('click', function () { S.exam = { id: b.getAttribute('data-start'), start: Date.now(), scores: {} }; save(); renderBar(); renderExam(); }); });
      return;
    }
    var ex = EXAMS[S.exam.id], total = 0, arr = false, lst = false;
    var rows = ex.slots.map(function (s, i) {
      var p = BY_ID[s[0]], f = (S.exam.scores || {})[s[0]] || 0, sc = Math.round(s[1] * f * 10) / 10;
      total += sc;
      if (f === 1 && s[2] === 'array') arr = true;
      if (f === 1 && s[2] === 'list') lst = true;
      return '<tr' + (s[2] ? ' class="hurdle"' : '') + '><td>Q' + (i + 1) + '</td><td><a href="#' + hashOf(p.id) + '">' + esc(p.title) + '</a>' + (s[2] ? ' <span class="tag hurdle">' + s[2] + ' hurdle</span>' : '') + '</td><td class="num">' + sc + ' / ' + s[1] + '</td></tr>';
    }).join('');
    total = Math.round(total * 10) / 10;
    var pass = arr && lst && total >= 50;
    view.innerHTML = '<div class="exam-head"><div><h1>' + esc(ex.name) + '</h1><p class="lede" style="margin:0">' + (active ? 'Open a question, submit as often as you like; the best submission counts.' : 'Time is up. This is your final result.') + '</p></div><div class="clock" id="examClock">' + fmtClock(EXAM_MS - (Date.now() - S.exam.start)) + '</div></div>' +
      '<div class="hurdles"><span class="hb ' + (arr ? 'pass' : active ? 'wait' : 'fail') + '">Array hurdle ' + (arr ? 'passed' : 'not yet') + '</span><span class="hb ' + (lst ? 'pass' : active ? 'wait' : 'fail') + '">Linked list hurdle ' + (lst ? 'passed' : 'not yet') + '</span><span class="hb ' + (pass ? 'pass' : active ? 'wait' : 'fail') + '">Score ' + total + ' / 100</span></div>' +
      '<div class="panel" style="margin-top:16px"><table class="paper"><thead><tr><th>Q</th><th>Question</th><th>Score</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="quick"><button class="btn" id="endExam">' + (active ? 'End exam now' : 'Close this exam') + '</button></div>';
    var confirmEnd = false;
    $('#endExam').addEventListener('click', function () {
      if (active && !confirmEnd) { confirmEnd = true; $('#endExam').textContent = 'Click again to end'; return; }
      if (active) { S.exam.start = Date.now() - EXAM_MS; save(); renderBar(); renderExam(); return; }
      S.exam = null; save(); renderBar(); renderExam();
    });
  }

  // ---------------------------------------------------------------- flashcards
  var cardState = { order: null, pos: 0, flipped: false, section: 'All' };
  function renderCards() {
    document.title = 'Flashcards · Hurdle';
    var sections = ['All'];
    CARDS.forEach(function (c) { if (sections.indexOf(c.section) < 0) sections.push(c.section); });
    var pool = CARDS.map(function (c, i) { return i; }).filter(function (i) { return (cardState.section === 'All' || CARDS[i].section === cardState.section) && !S.known[i]; });
    if (!cardState.order || cardState.order.some(function (i) { return pool.indexOf(i) < 0; }) || cardState.order.length !== pool.length) { cardState.order = shuffle(pool.slice()); cardState.pos = 0; cardState.flipped = false; }
    var knownN = Object.keys(S.known).length;
    var chips = sections.map(function (s) { return '<button class="chip' + (s === cardState.section ? ' on' : '') + '" data-s="' + esc(s) + '">' + esc(s) + '</button>'; }).join('');
    var body;
    if (!cardState.order.length) body = '<div class="flash"><div class="q">You know every card in this set.</div><div class="card-actions"><button class="btn" id="resetCards">Start this set again</button></div></div>';
    else {
      var c = CARDS[cardState.order[cardState.pos % cardState.order.length]];
      body = '<div class="flash" id="flash" tabindex="0" role="button" aria-label="Flip card"><div class="sec">' + esc(c.section) + ' · ' + (cardState.order.length) + ' left</div><div class="q">' + c.q + '</div>' + (cardState.flipped ? '<div class="a">' + c.a + '</div>' : '<div class="small muted" style="margin-top:18px">Say the answer out loud, then tap to check (Space)</div>') + '</div>' +
        '<div class="card-actions">' + (cardState.flipped ? '<button class="btn" id="again">Again (A)</button><button class="btn primary" id="knew">I knew it (K)</button>' : '<button class="btn primary" id="flip">Show answer</button>') + '</div>';
    }
    view.innerHTML = '<div class="cards-wrap"><h1>Flashcards</h1><p class="lede">The 80 rapid-fire questions from the rote book. Cards you know drop out; the rest come back. ' + knownN + ' of ' + CARDS.length + ' known.</p><div class="chips" id="cchips">' + chips + '</div>' + body + '</div>';
    $all('#cchips .chip').forEach(function (b) { b.addEventListener('click', function () { cardState.section = b.getAttribute('data-s'); cardState.order = null; renderCards(); }); });
    function flip() { cardState.flipped = true; renderCards(); }
    function answer(knew) { var i = cardState.order[cardState.pos % cardState.order.length]; if (knew) { S.known[i] = 1; save(); cardState.order.splice(cardState.pos % cardState.order.length, 1); } else { cardState.pos++; } cardState.flipped = false; renderCards(); }
    var f = $('#flash'); if (f) f.addEventListener('click', function () { if (!cardState.flipped) flip(); });
    var fb = $('#flip'); if (fb) fb.addEventListener('click', flip);
    var kb = $('#knew'); if (kb) kb.addEventListener('click', function () { answer(true); });
    var ab = $('#again'); if (ab) ab.addEventListener('click', function () { answer(false); });
    var rc = $('#resetCards'); if (rc) rc.addEventListener('click', function () { CARDS.forEach(function (c, i) { if (cardState.section === 'All' || c.section === cardState.section) delete S.known[i]; }); save(); cardState.order = null; renderCards(); });
  }
  document.addEventListener('keydown', function (e) {
    if ((location.hash || '') !== '#cards' || e.target.closest('textarea, input, .CodeMirror')) return;
    if (e.key === ' ' && !cardState.flipped) { e.preventDefault(); var fb = $('#flip'); if (fb) fb.click(); }
    else if ((e.key === 'k' || e.key === 'K') && cardState.flipped) { var kb = $('#knew'); if (kb) kb.click(); }
    else if ((e.key === 'a' || e.key === 'A') && cardState.flipped) { var ab = $('#again'); if (ab) ab.click(); }
  });
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // ---------------------------------------------------------------- playground
  var PG_DEFAULT = '#include <stdio.h>\n\nint main(void) {\n    int n;\n    printf("Enter a number: ");\n    if (scanf("%d", &n) != 1) {\n        printf("Invalid number\\n");\n        return 0;\n    }\n    for (int i = 1; i <= n; i++) {\n        printf("%d squared is %d\\n", i, i * i);\n    }\n    return 0;\n}\n';
  function renderPlayground() {
    document.title = 'Playground · Hurdle';
    view.innerHTML = '<h1>Playground</h1><p class="lede">Write any C program and run it. Same checks as the judge: NULL pointers, array bounds, uninitialised values, use after free, double free and leaks.</p><div class="pg"><div class="ed-card"><div class="toolbar"><span class="file">main.c</span><button class="btn small" id="pgReset">New</button><button class="btn primary" id="pgRun">Run <kbd>Ctrl+Enter</kbd></button></div><div id="pgHost"></div></div><div style="display:flex;flex-direction:column;gap:10px;min-width:0"><div class="console"><div class="tabs"><button class="on">Input</button></div><div class="tabpane"><textarea class="stdin" id="pgIn" spellcheck="false" aria-label="Program input">5\n</textarea></div></div><div class="console"><div class="tabs"><button class="on">Output</button></div><div class="tabpane" id="pgOut"><div class="empty">Press Run.</div></div></div></div></div>';
    var cm = makeEditor($('#pgHost'), S.playground || PG_DEFAULT, { 'Ctrl-Enter': function () { go(); }, 'Cmd-Enter': function () { go(); } });
    cm.on('change', function () { S.playground = cm.getValue(); save(); clearErr(cm); });
    var running = false;
    function go() { if (running) return; running = true; clearErr(cm); $('#pgOut').innerHTML = '<div class="verdict v-RUN"><span class="spinner"></span> Running…</div>'; runCode(cm.getValue(), $('#pgIn').value, function (r) { running = false; showRun($('#pgOut'), r, cm); }); }
    $('#pgRun').addEventListener('click', go);
    $('#pgReset').addEventListener('click', function () { cm.setValue(PG_DEFAULT); });
  }

  route();
  getWorker();
})();
</script>

</body></html>
